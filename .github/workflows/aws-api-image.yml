name: AWS API image

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api-arm64:
    name: linux/arm64 API image
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          load: true
          tags: captures-api:test
          cache-from: type=gha,scope=captures-api
          cache-to: type=gha,scope=captures-api,mode=max
      - name: Verify image, startup migrations, and protected API
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect captures-api:test --format '{{.Architecture}}')" = arm64
          test "$(docker image inspect captures-api:test --format '{{.Os}}')" = linux
          test "$(docker run --rm --entrypoint id captures-api:test -u)" != 0
          trap 'docker rm -f captures-api-test captures-db-test >/dev/null 2>&1 || true' EXIT
          docker run -d --name captures-db-test --network host \
            -e POSTGRES_USER=captures_test -e POSTGRES_DB=captures_test \
            -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17
          for _ in {1..30}; do
            if docker exec captures-db-test pg_isready -h 127.0.0.1 -U captures_test; then break; fi
            sleep 1
          done
          docker exec captures-db-test pg_isready -h 127.0.0.1 -U captures_test
          docker run -d --name captures-api-test --network host \
            -e DATABASE_URL='postgres://captures_test@127.0.0.1:5432/captures_test?application_name=runtime' \
            -e MIGRATION_DATABASE_URL='postgres://captures_test@127.0.0.1:5432/captures_test?application_name=migration' \
            captures-api:test
          for attempt in first restart; do
            if [[ "$attempt" == restart ]]; then docker restart captures-api-test; fi
            ready=false
            for _ in {1..30}; do
              if curl -fsS http://127.0.0.1:3001/health >/dev/null; then ready=true; break; fi
              sleep 1
            done
            if [[ "$ready" != true ]]; then docker logs captures-api-test; exit 1; fi
            test "$(curl -fsS http://127.0.0.1:3001/health)" = '{"status":"ok"}'
            test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/api/account/me)" = 503
            test "$(docker exec captures-db-test psql -U captures_test -Atc \
              'SELECT count(*) FROM _sqlx_migrations WHERE success')" -gt 0
            test "$(docker exec captures-db-test psql -U captures_test -Atc \
              'SELECT count(*) FROM users')" = 0
            test "$(docker exec captures-db-test psql -U captures_test -Atc \
              "SELECT count(*) FROM pg_stat_activity WHERE application_name='migration'")" = 0
          done
      - name: Export verified API image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save --output "$RUNNER_TEMP/captures-api.tar" captures-api:test
      - name: Upload verified API image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: captures-api-image
          path: ${{ runner.temp }}/captures-api.tar
          retention-days: 1
          compression-level: 0

  publish-ecr:
    name: Publish immutable API image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [api-arm64]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    env:
      AWS_REGION: us-east-1
      ECR_REGISTRY: 395451633568.dkr.ecr.us-east-1.amazonaws.com
      ECR_REPOSITORY: production/captures
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::395451633568:role/production-captures-ecr-publisher
          role-session-name: captures-api-ecr-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "395451633568"
      - name: Check for an existing immutable tag
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          tag="api-${GITHUB_SHA}"
          digest="$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
            --query "imageDetails[?imageTags && contains(imageTags, '${tag}')].imageDigest | [0]" \
            --output json | jq -r '. // empty')"
          if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'exists=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'exists=false\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Download verified API image
        if: steps.existing.outputs.exists != 'true'
        uses: actions/download-artifact@v4
        with:
          name: captures-api-image
          path: ${{ runner.temp }}
      - name: Load verified API image
        if: steps.existing.outputs.exists != 'true'
        run: docker load --input "$RUNNER_TEMP/captures-api.tar"
      - name: Log in to Amazon ECR
        if: steps.existing.outputs.exists != 'true'
        uses: aws-actions/amazon-ecr-login@v2.1.6
      - name: Publish verified immutable API image
        if: steps.existing.outputs.exists != 'true'
        run: |
          set -euo pipefail
          image="${ECR_REGISTRY}/${ECR_REPOSITORY}:api-${GITHUB_SHA}"
          docker tag captures-api:test "$image"
          docker push "$image"
      - name: Publish tested immutable API image
        id: record
        shell: bash
        run: |
          set -euo pipefail
          tag="api-${GITHUB_SHA}"
          image="${ECR_REGISTRY}/${ECR_REPOSITORY}:${tag}"
          digest="$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$tag" --query 'imageDetails[0].imageDigest' --output text)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf '### Captures API image ready\n\n`%s@%s`\n\nPublishing does not deploy. Use the infrastructure account activation/deployment procedure.\n' \
            "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Notify deployment webhook
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          DEPLOY_NOTIFICATION_WEBHOOK_URL: ${{ secrets.DEPLOY_NOTIFICATION_WEBHOOK_URL }}
          DEPLOY_WORKFLOW_URL: https://github.com/joswayski/infrastructure/actions/workflows/deploy-captures-api.yml
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.record.outputs.digest }}
        run: |
          set -euo pipefail

          if [[ -z "$DEPLOY_NOTIFICATION_WEBHOOK_URL" ]]; then
            echo "DEPLOY_NOTIFICATION_WEBHOOK_URL is not configured; skipping notification."
            exit 0
          fi

          commit_title="${COMMIT_MESSAGE%%$'\n'*}"
          commit_body=""
          if [[ "$COMMIT_MESSAGE" == *$'\n'* ]]; then
            commit_body="${COMMIT_MESSAGE#*$'\n'}"
          fi

          if pull_requests="$(curl --fail --show-error --silent \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls?per_page=1")" && \
            pull_request="$(jq -cer '.[0] | select(type == "object") | {title, body}' <<< "$pull_requests")"; then
            commit_title="$(jq -r '.title // ""' <<< "$pull_request")"
            commit_body="$(jq -r '.body // ""' <<< "$pull_request")"
          fi

          payload="$(jq -cn \
            --arg git_sha "$GITHUB_SHA" \
            --arg digest "$IMAGE_DIGEST" \
            --arg deploy_url "$DEPLOY_WORKFLOW_URL" \
            --arg commit_title "$commit_title" \
            --arg commit_body "$commit_body" \
            'def truncate_field:
              if length > 1024 then .[:1021] + "..." else . end;
            ($commit_title | rtrimstr("\r") | truncate_field) as $title |
            ($commit_body | split("\n") | map(rtrimstr("\r")) | join("\n")
              | sub("^([ \\t]*\\n)+"; "")
              | sub("(\\n[ \\t]*)+$"; "")) as $body |
            {
              username: "Production deploys",
              embeds: [{
                title: "Captures API image is ready",
                description: "Deploy Captures API triggers this exact API image. Open GitHub is the fallback.",
                color: 5763711,
                fields: ([
                  {name: "Git SHA", value: ("`" + $git_sha + "`"), inline: false},
                  {name: "Digest", value: ("`" + $digest + "`"), inline: false},
                  {name: "Title", value: $title, inline: false}
                ] + (if $body | test("[^[:space:]]") then
                  [{name: "Description", value: ($body | truncate_field), inline: false}]
                else [] end))
              }],
              components: [{
                type: 1,
                components: [
                  {
                    type: 2,
                    style: 3,
                    label: "Deploy Captures API",
                    custom_id: ("production-deploy:v1:captures-api:" + $git_sha)
                  },
                  {type: 2, style: 5, label: "Open GitHub", url: $deploy_url}
                ]
              }]
            }')"

          curl --fail --show-error --silent --retry 3 --retry-all-errors --max-time 10 \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "${DEPLOY_NOTIFICATION_WEBHOOK_URL}?wait=false&with_components=true"
