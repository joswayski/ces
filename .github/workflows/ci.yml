name: CI

on:
  pull_request:

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          GITHUB_TOKEN: ${{ github.token }}

  accounts:
    name: Account database and API image
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
      - run: cargo test -p captures-api -- --include-ignored
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - run: docker build -f apps/api/Dockerfile -t captures-api:test .

  rust:
    name: Rust checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libclang-dev \
            libdbus-1-dev \
            libegl-dev \
            libgbm-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            librsvg2-dev \
            libssl-dev \
            libwayland-dev \
            libwebkit2gtk-4.1-dev \
            libxcb1-dev \
            libxdo-dev \
            libxrandr-dev \
            pkg-config \
            wget
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  macos-app:
    name: macOS app bundle
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
      - run: npm ci
      - uses: ./.github/actions/prepare-media
      - run: npm run tauri:build --workspace @captures/desktop -- --config src-tauri/tauri.recording.local.conf.json
      - name: Validate bundled media sidecars and notices
        shell: bash
        run: |
          app="target/release/bundle/macos/Captures.app"
          ffmpeg="$(find "$app/Contents/MacOS" -maxdepth 1 -type f -name 'ffmpeg*' -print -quit)"
          ffprobe="$(find "$app/Contents/MacOS" -maxdepth 1 -type f -name 'ffprobe*' -print -quit)"
          test -n "$ffmpeg"
          test -n "$ffprobe"
          test -f "$app/Contents/Resources/notices/ffmpeg/BUILD_CONFIG.txt"
          test -f "$app/Contents/Resources/notices/ffmpeg/COPYING.LGPLv2.1"
          test -f "$app/Contents/Resources/notices/ffmpeg/NOTICE.md"
          test -f "$app/Contents/Resources/notices/openh264/LICENSE"
          test -f "$app/Contents/Resources/notices/openh264/NOTICE.md"
          node scripts/validate-ffmpeg-sidecars.mjs \
            "$ffmpeg" \
            "$ffprobe" \
            "$app/Contents/Resources/notices/ffmpeg/BUILD_CONFIG.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: captures-macos-app
          path: target/release/bundle/macos/Captures.app

  cross-platform-app:
    name: Desktop app (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-2025
            bundle: nsis
            artifact_name: captures-windows-installer
            artifact_path: target/release/bundle/nsis/*.exe
          - platform: Ubuntu
            os: ubuntu-24.04
            bundle: deb
            artifact_name: captures-ubuntu-package
            artifact_path: target/release/bundle/deb/*.deb
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libclang-dev \
            libdbus-1-dev \
            libegl-dev \
            libgbm-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            librsvg2-dev \
            libssl-dev \
            libwayland-dev \
            libwebkit2gtk-4.1-dev \
            libxcb1-dev \
            libxdo-dev \
            libxrandr-dev \
            nasm \
            pkg-config \
            wget \
            xz-utils \
            yasm \
            zlib1g-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          path-type: inherit
          install: >-
            base-devel
            diffutils
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-yasm
            mingw-w64-ucrt-x86_64-zlib
      - run: npm ci
      - uses: ./.github/actions/prepare-media
      - name: Build desktop app through the root build command
        run: npm run build -- --bundles ${{ matrix.bundle }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
