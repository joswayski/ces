name: AWS image

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  image-arm64:
    name: linux/arm64 image
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: captures:arm64
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
          secrets: |
            github_token=${{ github.token }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Assert linux/arm64 image
        run: |
          os="$(docker image inspect captures:arm64 --format '{{.Os}}')"
          arch="$(docker image inspect captures:arm64 --format '{{.Architecture}}')"
          test "$os" = "linux"
          test "$arch" = "arm64"
          machine="$(docker run --rm --platform linux/arm64 --entrypoint uname captures:arm64 -m)"
          test "$machine" = "aarch64"
      - name: Verify the production health endpoint
        run: |
          container_id="$(docker run --detach --platform linux/arm64 --publish 127.0.0.1:3000:3000 captures:arm64)"
          trap 'docker rm --force "$container_id" >/dev/null' EXIT

          for _ in {1..30}; do
            if response="$(curl --fail --silent --show-error http://127.0.0.1:3000/health)"; then
              test "$response" = '{"status":"ok"}'
              exit 0
            fi
            sleep 1
          done

          docker logs "$container_id"
          exit 1

  publish-ecr:
    name: Publish immutable ECR image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [image-arm64]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    outputs:
      image: ${{ steps.record.outputs.image }}
      digest: ${{ steps.record.outputs.digest }}
    env:
      AWS_ACCOUNT_ID: "395451633568"
      AWS_REGION: us-east-1
      ECR_REGISTRY: 395451633568.dkr.ecr.us-east-1.amazonaws.com
      ECR_REPOSITORY: production/captures
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::395451633568:role/production-captures-ecr-publisher
          role-session-name: captures-ecr-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
      - name: Check for an existing immutable tag
        id: existing
        run: |
          digest="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$GITHUB_SHA" \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>/dev/null || true)"
          if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'exists=true\n' >> "$GITHUB_OUTPUT"
            printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          else
            printf 'exists=false\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Log in to Amazon ECR
        if: steps.existing.outputs.exists != 'true'
        uses: aws-actions/amazon-ecr-login@v2.1.6
      - if: steps.existing.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3
      - name: Build and push linux/arm64 image
        id: build
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
          secrets: |
            github_token=${{ github.token }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record immutable image
        id: record
        env:
          DIGEST: ${{ steps.build.outputs.digest || steps.existing.outputs.digest }}
        run: |
          image="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
          printf 'digest=%s\n' "$DIGEST" >> "$GITHUB_OUTPUT"
          printf '### Published image\n\n`%s@%s`\n' "$image" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Notify deployment webhook
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          DEPLOY_NOTIFICATION_WEBHOOK_URL: ${{ secrets.DEPLOY_NOTIFICATION_WEBHOOK_URL }}
          DEPLOY_WORKFLOW_URL: https://github.com/joswayski/infrastructure/actions/workflows/deploy-captures.yml
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.record.outputs.digest }}
        run: |
          set -euo pipefail

          if [[ -z "$DEPLOY_NOTIFICATION_WEBHOOK_URL" ]]; then
            echo "DEPLOY_NOTIFICATION_WEBHOOK_URL is not configured; skipping notification."
            exit 0
          fi

          commit_title="${COMMIT_MESSAGE%%$'\n'*}"
          commit_body=""
          if [[ "$COMMIT_MESSAGE" == *$'\n'* ]]; then
            commit_body="${COMMIT_MESSAGE#*$'\n'}"
          fi

          if pull_requests="$(curl --fail --show-error --silent \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls?per_page=1")" && \
            pull_request="$(jq -cer '.[0] | select(type == "object") | {title, body}' <<< "$pull_requests")"; then
            commit_title="$(jq -r '.title // ""' <<< "$pull_request")"
            commit_body="$(jq -r '.body // ""' <<< "$pull_request")"
          fi

          payload="$(jq -cn \
            --arg git_sha "$GITHUB_SHA" \
            --arg digest "$IMAGE_DIGEST" \
            --arg deploy_url "$DEPLOY_WORKFLOW_URL" \
            --arg commit_title "$commit_title" \
            --arg commit_body "$commit_body" \
            'def truncate_field:
              if length > 1024 then .[:1021] + "..." else . end;
            ($commit_title | rtrimstr("\r") | truncate_field) as $title |
            ($commit_body | split("\n") | map(rtrimstr("\r")) | join("\n")
              | sub("^([ \\t]*\\n)+"; "")
              | sub("(\\n[ \\t]*)+$"; "")) as $body |
            {
              username: "Production deploys",
              embeds: [{
                title: "Captures web image is ready",
                description: "Deploy Captures web triggers this exact web image. Open GitHub is the fallback.",
                color: 5763711,
                fields: ([
                  {name: "Git SHA", value: ("`" + $git_sha + "`"), inline: false},
                  {name: "Digest", value: ("`" + $digest + "`"), inline: false},
                  {name: "Title", value: $title, inline: false}
                ] + (if $body | test("[^[:space:]]") then
                  [{name: "Description", value: ($body | truncate_field), inline: false}]
                else [] end))
              }],
              components: [{
                type: 1,
                components: [
                  {
                    type: 2,
                    style: 3,
                    label: "Deploy Captures web",
                    custom_id: ("production-deploy:v1:captures:" + $git_sha)
                  },
                  {type: 2, style: 5, label: "Open GitHub", url: $deploy_url}
                ]
              }]
            }')"

          curl --fail --show-error --silent --retry 3 --retry-all-errors --max-time 10 \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "${DEPLOY_NOTIFICATION_WEBHOOK_URL}?wait=false&with_components=true"
